<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>로그인 | AI Screw Inspection</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#e9f1ff;background:#0b1424}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 5%,#203658 0%,#0b1424 60%)}.login{width:min(100%,420px);background:#152237;border:1px solid #354761;border-radius:22px;padding:36px;box-shadow:0 20px 70px #0005;text-align:center}.icon{display:inline-grid;place-items:center;width:60px;height:60px;border-radius:18px;background:#263e5d;color:#80cfff;font-size:30px}h1{font-size:25px;margin:20px 0 6px}.sub{color:#9bb2cd;font-size:14px;margin:0 0 30px}.field{text-align:left;margin:18px 0}label{display:block;color:#c4d4e7;font-size:13px;margin-bottom:8px}input{width:100%;padding:14px;border:1px solid #3c536f;border-radius:10px;background:#23344e;color:white;font-size:16px;outline:none}input:focus{border-color:#70c5ff;box-shadow:0 0 0 3px #70c5ff24}button{width:100%;padding:14px;border:0;border-radius:10px;background:#3178ea;color:white;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px}button:hover{background:#4b8df5}.error{background:#502b37;color:#ffb9c6;border-radius:9px;padding:11px;font-size:13px}.foot{color:#8a9db5;font-size:12px;margin-top:25px}</style></head><body><main class="login"><div class="icon">♢</div><h1>AI Screw Inspection</h1><p class="sub">AI 나사 검사 시스템 · 보안 로그인</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ session['login_csrf'] }}"><div class="field"><label for="username">사용자 이름</label><input id="username" name="username" value="admin" autocomplete="username" required></div><div class="field"><label for="password">비밀번호</label><input id="password" name="password" value="012345678910" type="password" autocomplete="off" required ></div><button type="submit">로그인</button></form><p class="foot">Authorized Access Only</p></main></body></html>
